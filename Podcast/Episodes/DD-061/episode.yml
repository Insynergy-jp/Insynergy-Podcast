description: >-
  Japan's Ministry of Justice is examining publicity rights, voice rights,
  deepfakes, and civil liability in the age of generative AI. This episode
  argues that rights doctrine can define prohibited outcomes but cannot by
  itself design who holds decision authority, when human judgment must
  intervene, or how accountability remains continuous.
