description: >-
  Institutions increasingly ask whether AI was used, but that question misses
  the real issue. This episode explains why authorship and accountability rest
  on ownership of judgment rather than manual production, and how Decision
  Boundaries and Decision Logs make that ownership explicit when human and AI
  contributions are intertwined.
